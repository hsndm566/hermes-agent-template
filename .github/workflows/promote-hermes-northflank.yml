name: Promote Hermes Northflank recovery

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/promote-hermes-northflank.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NF_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN || secrets.NORTHFLANK_API_KEY }}
      NF_TEAM: hsndms-team
      NF_PROJECT: adam
      NF_SERVICE: personal-cloud-agent-api
      NF_BUILD_ID: classy-robin-9791
      NF_SHA: b4915124696d1b8d5ba63ed78666c0ca10fceb7d
    steps:
      - name: Require existing Northflank credential
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${NF_TOKEN:-}" ]; then
            echo "No NORTHFLANK_API_TOKEN/NORTHFLANK_API_KEY GitHub secret is configured."
            exit 1
          fi

      - name: Wait for exact Northflank build
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.northflank.com/v1/teams/$NF_TEAM/projects/$NF_PROJECT/services/$NF_SERVICE/build/$NF_BUILD_ID"
          for attempt in $(seq 1 60); do
            body="$(curl --fail-with-body --silent --show-error               -H "Authorization: Bearer $NF_TOKEN"               "$api")"
            status="$(printf '%s' "$body" | jq -r '.data.status // empty')"
            sha="$(printf '%s' "$body" | jq -r '.data.sha // empty')"
            echo "Northflank build status: ${status:-unknown}"
            if [ "$sha" != "$NF_SHA" ] && [ -n "$sha" ]; then
              echo "Build SHA mismatch; refusing to deploy."
              exit 1
            fi
            if [ "$status" = "SUCCESS" ]; then
              exit 0
            fi
            case "$status" in
              FAILURE|ABORTED|CRASHED|SUBMISSION_FAILURE|UNSCHEDULABLE)
                echo "Northflank build did not succeed."
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for Northflank build."
          exit 1

      - name: Promote exact recovery image
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error             -X POST             -H "Authorization: Bearer $NF_TOKEN"             -H "Content-Type: application/json"             --data "$(jq -nc               --arg id "$NF_SERVICE"               --arg branch "main"               --arg sha "$NF_SHA"               --arg buildId "$NF_BUILD_ID"               '{internal:{id:$id,branch:$branch,buildSHA:$sha,buildId:$buildId}}')"             "https://api.northflank.com/v1/teams/$NF_TEAM/projects/$NF_PROJECT/services/$NF_SERVICE/deployment"
          echo
          echo "Northflank promotion request accepted."

      - name: Verify public Hermes health
        shell: bash
        run: |
          set -euo pipefail
          url="https://p01--personal-cloud-agent-api--ds968wvrhzcj.code.run/health"
          for attempt in $(seq 1 60); do
            body="$(curl --silent --show-error --max-time 10 "$url" || true)"
            if echo "$body" | jq -e '.status=="ok" and .gateway=="running" and .voice_stt=="ready"' >/dev/null 2>&1; then
              echo "$body"
              exit 0
            fi
            sleep 5
          done
          echo "Public Hermes health did not return ready after promotion."
          exit 1
