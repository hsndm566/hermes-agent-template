name: Validate Hermes image

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "start.sh"
      - "requirements.txt"
      - "scripts/**"
      - "personalization/**"
      - ".github/workflows/validate-image.yml"
  workflow_dispatch:

concurrency:
  group: hermes-image-validation
  cancel-in-progress: true

jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build validation image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: hermes-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Auditor image checks
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh hermes-agent:ci -lc '
            set -eu
            python -c "import faster_whisper; from faster_whisper import WhisperModel"
            test -s /opt/faster-whisper-models/base/model.bin
            test -s /opt/faster-whisper-models/base/config.json
            /opt/hierarchy-venv/bin/python -c "from core.registry.profile_registry import ProfileRegistry; from core.ipc.message_bus import MessageBus"
            python -m py_compile /app/server.py /app/scripts/bootstrap-hermes-team.py /app/scripts/patch-hermes-telegram-voice.py
            bash -n /app/start.sh
            grep -Fq "unload_after_idle_seconds" /app/start.sh
            grep -Fq "/opt/faster-whisper-models/base" /app/start.sh
          '
