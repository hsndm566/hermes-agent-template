name: Heroku Secret Check
on:
  push:
    branches: [audit/heroku-secret-check-20260924]
    paths: [.github/workflows/heroku-secret-check.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe Heroku secret and list safe app metadata
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${HEROKU_API_KEY:-}" ]; then
            echo "HEROKU_KEY_PRESENT=false"
            exit 0
          fi
          echo "HEROKU_KEY_PRESENT=true"
          curl -fsS https://api.heroku.com/apps             -H "Accept: application/vnd.heroku+json; version=3"             -H "Authorization: Bearer ${HEROKU_API_KEY}"             -o /tmp/apps.json
          python - <<'PY'
          import json
          apps=json.load(open('/tmp/apps.json'))
          print("APP_COUNT="+str(len(apps)))
          for app in sorted(apps,key=lambda a:a.get('updated_at',''),reverse=True):
              print(json.dumps({
                "name":app.get("name"),
                "web_url":app.get("web_url"),
                "updated_at":app.get("updated_at"),
                "maintenance":app.get("maintenance"),
                "stack":(app.get("stack") or {}).get("name"),
                "region":(app.get("region") or {}).get("name"),
              },sort_keys=True))
          PY
