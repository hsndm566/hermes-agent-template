name: Hermes Web Bridge Syntax

on:
  push:
    branches: [feat/public-web-api-proxy]

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m py_compile server.py
